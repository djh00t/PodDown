[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poddown-studio"
version = "0.0.0"
description = "Production-quality podcasts from Markdown documents."
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.49",
  "fastapi==0.139.0",
  "nats-py==2.15.0",
  "PyJWT==2.13.0",
  "psycopg[binary]==3.3.4",
  "pydantic>=2.11,<3",
  "temporalio>=1.30,<1.31",
  "uvicorn==0.51.0",
  "uuid6==2025.0.1",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
poddown = "poddown.cli:main"
poddown-demo = "poddown.demo:main"
poddown-mcp = "poddown.agent_mcp_stdio:main"
poddown-api = "poddown.runtime:api_main"
poddown-worker = "poddown.runtime:worker_main"

[tool.hatch.build.targets.wheel]
packages = ["src/poddown"]

[tool.hatch.build.targets.wheel.force-include]
"skills/poddown/v1" = "poddown/skills/v1"
"integrations/reference-demo/v1" = "poddown/reference-demo/v1"

[tool.hatch.build.targets.sdist]
include = [
  "src/poddown/**",
  "skills/poddown/v1/**",
  "integrations/reference-demo/v1/**",
]
exclude = [
  "/.coverage",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.superpowers",
  "/build",
  "/dist",
  "/htmlcov",
  "/.venv",
]

[dependency-groups]
dev = [
  "httpx2==2.5.0",
  "jsonschema==4.26.0",
  "mypy>=1.17,<2",
  "pdoc>=15,<16",
  "pytest>=9.1.1,<10",
  "pytest-bdd>=8.1,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-config --strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "live_provider: opt-in tests that consume external provider APIs and budget",
]

[tool.coverage.run]
branch = true
source = ["poddown"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["poddown"]
